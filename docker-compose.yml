
services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=admission;Username=school;Password=school_dev"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d admission"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
